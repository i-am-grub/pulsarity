name: Ruff Linting Check

permissions:
  contents: read
  issues: read
  pull-requests: write
  checks: write

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '*.rst', '.gitignore', '.gitmodules', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '*.md', '*.rst', '.gitignore', '.gitmodules', 'LICENSE']
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Ruff linting check
      uses: astral-sh/ruff-action@v3
