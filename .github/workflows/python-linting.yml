name: Python Type Checking and Linting

permissions:
  contents: read
  issues: read
  pull-requests: write
  checks: write

on:
  push:
    branches: [main]
    paths: [
      'src/pulsarity/*',
      'tests/*',
      'pyproject.toml',
      'uv.lock'
    ]
  pull_request:
    paths: [
      'src/pulsarity/*',
      'tests/*',
      'pyproject.toml',
      'uv.lock'
    ]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install the project
      run: uv sync --group dev
    
    - name: Type checking with basedpyright
      id: pyright
      continue-on-error: true
      run: uv run basedpyright

    - name: Run Ruff formatter check
      uses: astral-sh/ruff-action@v3
      continue-on-error: true
      id: ruff-format
      with:
        args: format --check --diff
    
    - name: Run Ruff import check
      uses: astral-sh/ruff-action@v3
      continue-on-error: true
      id: ruff-imports
      with:
        args: check --select I

    - name: Run Ruff linting check
      id: ruff-lint
      continue-on-error: true
      uses: astral-sh/ruff-action@v3

    - name: Check Outcome
      if: |
        always() && 
        steps.pyright.outcome == 'failure' || 
        steps.ruff-format.outcome == 'failure' || 
        steps.ruff-imports.outcome == 'failure' || 
        steps.ruff-lint.outcome == 'failure'
      run: exit 1
