name: Python Type Checking and Linting

permissions:
  contents: read
  issues: read
  pull-requests: write
  checks: write

on:
  push:
    branches: [main]
    paths: [
      'src/pulsarity/**',
      'tests/**',
      'pyproject.toml',
      'uv.lock',
      '.github/workflows/python-linting.yml'
    ]
  pull_request:
    paths: [
      'src/pulsarity/**',
      'tests/**',
      'pyproject.toml',
      'uv.lock',
      '.github/workflows/python-linting.yml'
    ]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install the project
      run: uv sync --group dev
    
    - name: Type checking with basedpyright
      id: pyright
      continue-on-error: true
      run: uv run basedpyright

    - name: Run Ruff formatter check
      id: ruff-format
      continue-on-error: true
      run: uv run ruff format --check --diff
    
    - name: Run Ruff import check
      id: ruff-imports
      continue-on-error: true
      run: uv run ruff check --select I

    - name: Run Ruff linting check
      id: ruff-lint
      continue-on-error: true
      run: uv run ruff check

    - name: Check Outcome
      if: |
        always() && 
        steps.pyright.outcome == 'failure' || 
        steps.ruff-format.outcome == 'failure' || 
        steps.ruff-imports.outcome == 'failure' || 
        steps.ruff-lint.outcome == 'failure'
      run: exit 1
