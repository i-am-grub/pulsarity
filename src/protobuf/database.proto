syntax = "proto3";

import "google/protobuf/timestamp.proto";

package pulsarity.db;

message Attribute {
    string name = 1;
}

message Pilot {
    uint32 id = 1;
    string display_callsign = 2;
    string display_name = 3;
    repeated Attribute attributes = 4;
}

message Pilots {
    repeated Pilot pilots = 1;
}

message RaceEvent {
    uint32 id = 1;
    string name = 2;
    google.protobuf.Timestamp date = 3;
    repeated Attribute attributes = 4;
}

message RaceEvents {
    repeated RaceEvent events = 1;
}

message RaceClass {
    uint32 id = 1;
    string name = 2;
    repeated Attribute attributes = 3;
}

message RaceClasses {
    repeated RaceClass raceclasses = 1;
}

message Round {
    uint32 id = 1;
    uint32 round_num = 2;
    repeated Attribute attributes = 3;
}

message Rounds {
    repeated Round rounds = 1;
}

message Heat {
    uint32 id = 1;
    uint32 heat_num = 2;
    repeated Attribute attributes = 3;
}

message Heats {
    repeated Heat heats = 1;
}

message SignalRecord {
    float timedelta = 1;
    float value = 2;
}

message SignalHistory {
    repeated SignalRecord records = 1;
}